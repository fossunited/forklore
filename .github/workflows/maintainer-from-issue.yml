name: Maintainer from issue

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to convert
        required: true
        type: string

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  convert:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'maintainer-approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install OG image tooling
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Install site dependencies
        run: yarn --cwd site install --frozen-lockfile

      - name: Install parser dependencies
        run: python3 -m pip install requests

      - name: Resolve issue number
        id: issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch issue body
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue view "${{ steps.issue.outputs.number }}" --json body --jq .body > /tmp/maintainer-issue.md

      - name: Convert issue to maintainer Markdown
        id: convert
        run: python3 parse-maintainer.py /tmp/maintainer-issue.md

      - name: Validate and build
        run: yarn build

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "maint: ${{ steps.convert.outputs.full_name }} @ ${{ steps.convert.outputs.project_list }} (#${{ steps.issue.outputs.number }})"
          title: "maint: ${{ steps.convert.outputs.full_name }} @ ${{ steps.convert.outputs.project_list }} (#${{ steps.issue.outputs.number }})"
          body: "Generated from #${{ steps.issue.outputs.number }} using the maintainer issue workflow."
          branch: maintainer/issue-${{ steps.issue.outputs.number }}
          base: ${{ github.event.repository.default_branch }}
          add-paths: |
            content/maintainers
            public/images
            .image-cache.json
